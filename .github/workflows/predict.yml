name: Auto Predict and Update

on:
  # [定时调度架构变更]
  # 定时调度已由外部 Vercel Action Cron Hub 统一精准接管唤醒，彻底解决 GitHub schedule 队列延迟与丢单痛点。
  # 调度中心仓库: https://github.com/kuhung/action-cron-hub
  # 手动触发控制台: https://action-cron-hub.vercel.app/ (输入密钥后可直接在此网页上一键手动触发)
  # 对应任务: taskId = k-online-predict (所属分组: morning-early)
  # 执行时间: 每日 08:00 北京时间 (00:00 UTC)
  # 此处保留 workflow_dispatch 供 Vercel 主动触发（或在当前仓库 Actions 页面手动 Run workflow），原生 schedule 已注释以防止双跑。
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git versioning if needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: examples/my_kronos_cache
          key: ${{ runner.os }}-hf-models-v1

      - name: Create Virtual Environment and Install Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prediction Script
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 可选配置：如果需要使用 Binance.US，请在 Secrets 中设置 BINANCE_TLD 为 'us'
          BINANCE_TLD: ${{ secrets.BINANCE_TLD }}
          # 可选配置：如果需要通过代理访问，请在 Secrets 中设置 HTTP_PROXY 和 HTTPS_PROXY
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          chmod +x scripts/run.sh
          # Activate venv explicitly as the script expects it in ../.venv
          source .venv/bin/activate
          # Run the script with upload flag and predict mode
          ./scripts/run.sh -m all -p -u

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the predictions file
          git add web/public/predictions.json
          
          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "chore: update predictions data $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
